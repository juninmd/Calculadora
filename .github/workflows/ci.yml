name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Linter
        run: npm run lint
      - name: Check Code Formatting
        run: npx prettier --check "src/**/*.{ts,html,css,scss,json}"

    test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests
        run: npm test -- --code-coverage
      - name: Check Coverage Threshold
        run: |
          # Check if coverage is at least 80% for statements, branches, functions, lines
          npx istanbul check-coverage --statements 80 --branches 80 --functions 80 --lines 80 ./coverage/lcov.info || echo "Coverage check failed"
      - name: Run End-to-End Tests
        run: npm run e2e
      - name: Upload Test Reports
        if: always()
        run: |
          mkdir -p test-reports
          # Copy coverage report
          cp -r coverage/lcov.info test-reports/ 2>/dev/null || true
          # Copy test logs if they exist
          cp -r ./test-output/* test-reports/ 2>/dev/null || true || echo "No test-output directory"
          # If we have junit output, copy it
          cp -r ./junit.xml test-reports/ 2>/dev/null || true
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Upload Test Reports Artifact
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: test-reports

  type-check:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Type Check
        run: npx tsc --noEmit

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Security Audit
        run: npm audit --production
      - name: Run Dependency Check
        run: npx retire --exit-on-issue --severity moderate

  build:
    runs-on: ubuntu-latest
    needs: [test, type-check, security]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Build Production Artifacts
        run: npm run build -- --prod --source-map
      - name: Optimize Build
        run: |
          # Additional optimization steps could go here
          echo "Build optimization completed"
      - name: Generate Build Info
        run: |
          echo "BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> build.env
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> build.env
          echo "GIT_COMMIT=${GITHUB_SHA}" >> build.env
      - name: Save Build Info
        uses: actions/upload-artifact@v3
        with:
          name: build-info
          path: build.env
      - name: Save Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: production-build
          path: dist/

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Download Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: production-build
          path: ./dist
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging environment..."
          # Add actual staging deployment logic here
          # Example: firebase deploy --only hosting:staging
          echo "Staging deployment completed"
      - name: Post-Deployment Health Check
        run: |
          echo "Running health checks..."
          # Add health check logic here
          echo "Health checks passed"
      - name: Notify Deployment
        uses: slackapi/slack-github-action@v1.22.0
        with:
          payload: |
            {
              "text": ":rocket: Staging deployment successful for PR #${{ github.event.number }}\nRepo: ${{ github.repository }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()

  deploy-production:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Download Build Artifacts
        uses: actions/download-artifact@v3
        with:
          name: production-build
          path: ./dist
      - name: Deploy to Production
        run: |
          echo "Deploying to production environment..."
          # Add actual production deployment logic here
          # Example: firebase deploy --only hosting:production
          echo "Production deployment completed"
      - name: Post-Deployment Health Check
        run: |
          echo "Running health checks..."
          # Add health check logic here
          echo "Health checks passed"
      - name: Notify Deployment
        uses: slackapi/slack-github-action@v1.22.0
        with:
          payload: |
            {
              "text": ":rocket: Production deployment successful to main branch\nRepo: ${{ github.repository }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()

  rollback:
    runs-on: ubuntu-latest
    if: failure() && github.ref == 'refs/heads/main'
    needs: [deploy-production]
    steps:
      - name: Trigger Rollback
        run: |
          echo "Initiating rollback procedure..."
          # Add rollback logic here
          echo "Rollback completed"
      - name: Notify Rollback
        uses: slackapi/slack-github-action@v1.22.0
        with:
          payload: |
            {
              "text": ":warning: Production deployment failed - initiating rollback\nRepo: ${{ github.repository }}\nCommit: ${{ github.sha }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure:
    runs-on: ubuntu-latest
    if: failure()
    needs: [lint, test, type-check, security, build]
    steps:
      - name: Notify Failure
        uses: slackapi/slack-github-action@v1.22.0
        with:
          payload: |
            {
              "text": ":x: CI/CD Pipeline failed\nRepo: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nRun: ${{ github.run_number }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}